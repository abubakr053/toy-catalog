<!DOCTYPE html>
<!-- saved from url=(0044)file:///C:/Users/DELL/Downloads/catalog.html -->
<html lang="ar" dir="rtl"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كتالوج الجملة</title>
<style>
  :root{
    --ink:#1c1b29;
    --paper:#fbf7ef;
    --card:#ffffff;
    --line:#e7e1d3;
    --brand:#ff5a36;
    --brand-dark:#d43f1f;
    --stamp:#2f6f4e;
    --muted:#8a8574;
    --shadow: 0 1px 0 rgba(28,27,41,.04), 0 8px 20px rgba(28,27,41,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family: 'Tahoma','Segoe UI',sans-serif;
    padding-bottom:120px;
  }
  /* ===== Header ===== */
  header{
    padding:28px 20px 22px;
    background:var(--ink);
    color:var(--paper);
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute;
    inset:0;
    background-image: radial-gradient(circle, rgba(255,90,54,.35) 1.5px, transparent 1.5px);
    background-size: 18px 18px;
    opacity:.35;
  }
  .header-inner{position:relative;z-index:1;max-width:720px;margin:0 auto}
  .eyebrow{
    display:inline-block;
    font-size:12px;
    letter-spacing:.5px;
    background:var(--brand);
    color:#fff;
    padding:4px 10px;
    border-radius:999px;
    font-weight:bold;
    margin-bottom:10px;
  }
  h1{
    margin:0 0 6px;
    font-size:26px;
    font-weight:800;
  }
  header p{margin:0;color:#cfcbe0;font-size:14px}

  /* ===== Layout ===== */
  main{max-width:720px;margin:0 auto;padding:18px 16px}

  .search-row{
    display:flex;
    gap:8px;
    margin-bottom:18px;
  }
  .search-row input{
    flex:1;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--card);
    font-size:14px;
    color:var(--ink);
  }
  .search-row input:focus{outline:2px solid var(--brand); outline-offset:1px}

  .category-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:6px;
    margin-bottom:16px;
  }
  .cat-btn{
    flex:none;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
  }
  .cat-btn.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }
  @media(min-width:560px){
    .grid{grid-template-columns:repeat(3,1fr)}
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
  }
  .thumb{
    aspect-ratio:1/1;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    background:
      repeating-linear-gradient(45deg, #f1ede1 0 10px, #ece7d8 10px 20px);
    position:relative;
  }
  .code-tag{
    position:absolute;
    top:8px;
    right:8px;
    background:var(--ink);
    color:var(--paper);
    font-size:10px;
    padding:2px 7px;
    border-radius:6px;
    font-weight:bold;
    letter-spacing:.3px;
  }
  .card-body{
    padding:10px 12px 12px;
    display:flex;
    flex-direction:column;
    gap:6px;
    flex:1;
  }
  .name{font-size:13.5px;font-weight:bold;line-height:1.3}
  .meta{font-size:12px;color:var(--muted)}

  .qty-row{
    margin-top:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
  }
  .stepper{
    display:flex;
    align-items:center;
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .stepper button{
    width:30px;
    height:30px;
    border:none;
    background:var(--paper);
    font-size:16px;
    cursor:pointer;
    color:var(--ink);
  }
  .stepper button:active{background:var(--line)}
  .stepper input{
    width:38px;
    text-align:center;
    border:none;
    background:#fff;
    font-size:14px;
    font-weight:bold;
    padding:0;
    height:30px;
  }
  .stepper input:focus{outline:none}

  .add-badge{
    font-size:11px;
    color:var(--stamp);
    font-weight:bold;
    opacity:0;
    transition:opacity .2s;
  }
  .add-badge.show{opacity:1}

  /* ===== Floating cart bar ===== */
  .cart-bar{
    position:fixed;
    bottom:0; left:0; right:0;
    background:var(--ink);
    color:var(--paper);
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 -8px 24px rgba(0,0,0,.15);
    z-index:20;
  }
  .cart-info{font-size:13px;color:#cfcbe0}
  .cart-info strong{color:#fff;font-size:15px}
  .send-btn{
    background:var(--brand);
    color:#fff;
    border:none;
    padding:12px 20px;
    border-radius:12px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .send-btn:hover{background:var(--brand-dark)}
  .send-btn:disabled{opacity:.4;cursor:not-allowed}

  /* ===== Modal ===== */
  .overlay{
    position:fixed;inset:0;
    background:rgba(28,27,41,.55);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:30;
  }
  .overlay.open{display:flex}
  .sheet{
    background:var(--paper);
    width:100%;
    max-width:520px;
    border-radius:18px 18px 0 0;
    padding:20px;
    max-height:82vh;
    overflow-y:auto;
  }
  .sheet h2{margin:0 0 4px;font-size:18px}
  .sheet .sub{font-size:12px;color:var(--muted);margin-bottom:14px}
  .order-line{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 0;
    border-bottom:1px dashed var(--line);
    font-size:13.5px;
  }
  .order-line .qty{font-weight:bold;color:var(--brand-dark)}
  label.field{display:block;margin-top:14px;font-size:13px;font-weight:bold}
  .sheet input[type=text]{
    width:100%;
    margin-top:6px;
    padding:11px 12px;
    border-radius:10px;
    border:1px solid var(--line);
    font-size:14px;
  }
  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  .sheet-actions button{
    flex:1;
    padding:13px;
    border-radius:12px;
    border:none;
    font-weight:bold;
    font-size:14px;
    cursor:pointer;
  }
  .btn-cancel{background:#fff;border:1px solid var(--line) !important;color:var(--ink)}
  .btn-wa{background:#25D366;color:#fff}

  .empty-note{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:30px 10px;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <span class="eyebrow">طلب جملة</span>
    <h1>كتالوج الألعاب</h1>
    <p>اختر المنتجات وحدد الكمية، ثم أرسل الطلب مباشرة على واتساب</p>
  </div>
</header>

<main>
  <div class="search-row">
    <input id="searchInput" type="text" placeholder="ابحث باسم اللعبة...">
  </div>

  <div class="category-tabs" id="catTabs"></div>

  <div class="grid" id="productGrid"><div class="empty-note" style="grid-column:1/-1">تعذّر تحميل المنتجات (Failed to fetch). تأكد إن الشيت "Anyone with the link = Viewer" ومنشور كـ CSV.</div></div>
  <div class="empty-note" id="emptyNote" style="display:none">ما فيه منتجات مطابقة للبحث</div>
  <div style="text-align:center;margin-top:16px">
    <button id="loadMoreBtn" class="cat-btn" style="display:none;padding:10px 22px">عرض المزيد ↓</button>
  </div>
</main>

<div class="cart-bar">
  <div class="cart-info">
    عدد المنتجات المختارة: <strong id="itemCount">0</strong>
    &nbsp;|&nbsp; إجمالي القطع: <strong id="pieceCount">0</strong>
  </div>
  <button class="send-btn" id="openReview" disabled="">مراجعة الطلب ←</button>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2>ملخص الطلب</h2>
    <div class="sub">راجع الكميات قبل الإرسال</div>
    <div id="orderLines"></div>

    <label class="field">اسم المحل / العميل
      <input type="text" id="custName" placeholder="مثال: محل الأمل للألعاب">
    </label>
    <label class="field">رقم التواصل (اختياري)
      <input type="text" id="custPhone" placeholder="05xxxxxxxx">
    </label>

    <div class="sheet-actions">
      <button class="btn-cancel" id="closeSheet">تعديل الطلب</button>
      <button class="btn-wa" id="sendWa">إرسال عبر واتساب</button>
    </div>
  </div>
</div>

<script src="./كتالوج الجملة_files/papaparse.min.js.تنزيل"></script>
<script>
/* ============================================================
   مصدر المنتجات: رابط CSV المنشور من Google Sheet
   خطوات النشر: File > Share > Publish to web > اختر CSV > انسخ الرابط هنا
   أعمدة الشيت المطلوبة بالضبط (صف أول = عناوين):
   id | name | category | image_url
   ============================================================ */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1_F5aas87mYEO_gUIGIYw_hPJH5MOBl-eSSVjsstpu_E/gviz/tq?tqx=out:csv&gid=0";

/* ============================================================
   رقم واتساب المحل — غيّر الرقم هنا (بصيغة دولية بدون + أو 00)
   مثال للسعودية: 9665xxxxxxxx
   ============================================================ */
const WHATSAPP_NUMBER = "966552287053";

let PRODUCTS = [];
const BATCH_SIZE = 24; // عدد المنتجات المعروضة دفعة وحدة (لأداء أفضل مع 1000+ منتج)
let visibleCount = BATCH_SIZE;

const CAT_EMOJI = {
  "سيارات":"🏎️", "دباديب":"🧸", "دمى":"🪆", "تركيب":"🧩",
  "إلكترونية":"🤖", "رياضية":"⚽"
}; // إيموجي احتياطي يظهر فقط إذا المنتج بدون صورة

function loadProducts(){
  grid.innerHTML = `<div class="empty-note" style="grid-column:1/-1">جاري تحميل المنتجات...</div>`;

  fetch(SHEET_CSV_URL, {cache:"no-store"})
    .then(res=>{
      if(!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    })
    .then(csvText=>{
      const results = Papa.parse(csvText, { header:true, skipEmptyLines:true });
      PRODUCTS = results.data
        .filter(row=>row.id && row.name)
        .map(row=>({
          id: String(row.id).trim(),
          name: (row.name||"").trim(),
          cat: (row.category||"غير مصنف").trim(),
          img: (row.image_url||"").trim(),
          emoji: CAT_EMOJI[(row.category||"").trim()] || "🎁"
        }));
      if(PRODUCTS.length===0){
        grid.innerHTML = `<div class="empty-note" style="grid-column:1/-1">الرابط اشتغل لكن ما فيه منتجات. تأكد أسماء الأعمدة بالشيت: id, name, category, image_url</div>`;
        return;
      }
      renderTabs();
      renderGrid();
    })
    .catch(err=>{
      console.error(err);
      grid.innerHTML = `<div class="empty-note" style="grid-column:1/-1">تعذّر تحميل المنتجات (${err.message}). تأكد إن الشيت "Anyone with the link = Viewer" ومنشور كـ CSV.</div>`;
    });
}

/* ============================================================
   رابط n8n webhook (اختياري) — لو عندك workflow جاهز حط الرابط هنا
   وفعّل السطر sendToN8n() داخل دالة sendOrder
   ============================================================ */
const N8N_WEBHOOK_URL = ""; // مثال: "https://your-n8n.app/webhook/orders"

// ================= المنطق =================
const cart = {}; // {productId: qty}

const grid = document.getElementById('productGrid');
const catTabs = document.getElementById('catTabs');
const searchInput = document.getElementById('searchInput');
const emptyNote = document.getElementById('emptyNote');
const itemCountEl = document.getElementById('itemCount');
const pieceCountEl = document.getElementById('pieceCount');
const openReviewBtn = document.getElementById('openReview');
const overlay = document.getElementById('overlay');
const orderLines = document.getElementById('orderLines');

let activeCat = "الكل";

function categories(){
  const cats = ["الكل", ...new Set(PRODUCTS.map(p=>p.cat))];
  return cats;
}

function renderTabs(){
  catTabs.innerHTML = "";
  categories().forEach(cat=>{
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (cat===activeCat ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = ()=>{ activeCat = cat; renderTabs(); renderGrid(true); };
    catTabs.appendChild(btn);
  });
}

function renderGrid(resetPaging){
  if(resetPaging) visibleCount = BATCH_SIZE;

  const term = searchInput.value.trim().toLowerCase();
  const filtered = PRODUCTS.filter(p=>{
    const matchCat = activeCat==="الكل" || p.cat===activeCat;
    const matchSearch = p.name.toLowerCase().includes(term) || p.id.includes(term);
    return matchCat && matchSearch;
  });

  const items = filtered.slice(0, visibleCount);

  grid.innerHTML = "";
  emptyNote.style.display = filtered.length ? 'none' : 'block';

  const loadMoreBtn = document.getElementById('loadMoreBtn');
  loadMoreBtn.style.display = filtered.length > visibleCount ? 'inline-block' : 'none';

  items.forEach(p=>{
    const qty = cart[p.id] || 0;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="thumb">
        ${p.img ? `<img src="${p.img}" style="width:100%;height:100%;object-fit:cover" alt="${p.name}">` : p.emoji}
        <span class="code-tag">#${p.id}</span>
      </div>
      <div class="card-body">
        <div class="name">${p.name}</div>
        <div class="meta">${p.cat}</div>
        <div class="qty-row">
          <div class="stepper">
            <button data-action="minus" data-id="${p.id}">−</button>
            <input type="text" inputmode="numeric" readonly value="${qty}" id="qty-${p.id}">
            <button data-action="plus" data-id="${p.id}">+</button>
          </div>
          <span class="add-badge ${qty>0?'show':''}" id="badge-${p.id}">✓ مضاف</span>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  grid.querySelectorAll('.stepper button').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.id;
      const action = btn.dataset.action;
      let qty = cart[id] || 0;
      qty = action==='plus' ? qty+1 : Math.max(0, qty-1);
      if(qty===0) delete cart[id]; else cart[id]=qty;
      document.getElementById(`qty-${id}`).value = qty;
      const badge = document.getElementById(`badge-${id}`);
      badge.classList.toggle('show', qty>0);
      updateCartBar();
    };
  });
}

function updateCartBar(){
  const ids = Object.keys(cart);
  const totalPieces = ids.reduce((s,id)=>s+cart[id],0);
  itemCountEl.textContent = ids.length;
  pieceCountEl.textContent = totalPieces;
  openReviewBtn.disabled = ids.length===0;
}

function renderOrderLines(){
  orderLines.innerHTML = "";
  Object.keys(cart).forEach(id=>{
    const p = PRODUCTS.find(x=>x.id===id);
    const line = document.createElement('div');
    line.className = 'order-line';
    line.innerHTML = `<span>${p.name} <span style="color:var(--muted)">(#${p.id})</span></span><span class="qty">${cart[id]} قطعة</span>`;
    orderLines.appendChild(line);
  });
}

function buildOrderText(){
  const name = document.getElementById('custName').value.trim() || "بدون اسم";
  const phone = document.getElementById('custPhone').value.trim();
  let text = `*طلب جملة جديد*\n`;
  text += `العميل: ${name}\n`;
  if(phone) text += `الجوال: ${phone}\n`;
  text += `------------------\n`;
  Object.keys(cart).forEach(id=>{
    const p = PRODUCTS.find(x=>x.id===id);
    text += `#${p.id} - ${p.name} × ${cart[id]}\n`;
  });
  text += `------------------\n`;
  const total = Object.values(cart).reduce((s,q)=>s+q,0);
  text += `إجمالي القطع: ${total}`;
  return text;
}

async function sendToN8n(payload){
  if(!N8N_WEBHOOK_URL) return;
  try{
    await fetch(N8N_WEBHOOK_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
  }catch(e){ console.error('n8n webhook error', e); }
}

document.getElementById('openReview').onclick = ()=>{
  renderOrderLines();
  overlay.classList.add('open');
};
document.getElementById('closeSheet').onclick = ()=>{
  overlay.classList.remove('open');
};
document.getElementById('sendWa').onclick = ()=>{
  const text = buildOrderText();
  const payload = {
    customer: document.getElementById('custName').value.trim(),
    phone: document.getElementById('custPhone').value.trim(),
    items: Object.keys(cart).map(id=>{
      const p = PRODUCTS.find(x=>x.id===id);
      return {id:p.id, name:p.name, qty:cart[id]};
    }),
    date: new Date().toISOString()
  };
  sendToN8n(payload);

  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`;
  window.open(url, '_blank');
};

searchInput.addEventListener('input', ()=>renderGrid(true));
document.getElementById('loadMoreBtn').onclick = ()=>{
  visibleCount += BATCH_SIZE;
  renderGrid(false);
};

loadProducts();
updateCartBar();
</script>



</body></html>
